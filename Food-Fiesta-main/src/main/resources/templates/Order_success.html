<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Success | Food Fiesta Royal</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        .success-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: radial-gradient(ellipse at 50% 30%, rgba(201, 168, 76, 0.1) 0%, transparent 50%),
                        var(--surface-variant);
        }
        .success-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: 60px 48px;
            text-align: center;
            max-width: 520px;
            width: 100%;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--outline);
            position: relative;
            overflow: hidden;
        }
        .success-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--gold-gradient);
        }
        .success-icon {
            width: 80px;
            height: 80px;
            background: var(--primary-container);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 2rem;
            color: var(--gold);
            animation: successPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes successPop {
            0% { transform: scale(0); }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        .success-card h1 {
            font-family: var(--font-display);
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .success-card h1 i { color: var(--gold); }
        .amount-display {
            font-family: var(--font-display);
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--gold);
            margin: 20px 0 8px;
        }
        .success-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 32px;
            flex-wrap: wrap;
        }
        .confetti-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="confetti-container" id="confettiContainer"></div>
    <div class="success-wrapper">
        <div class="success-card animate-scale">
            <div class="success-icon">
                <i class="fa-solid fa-crown"></i>
            </div>
            <span class="section-tag">Order Confirmed</span>
            <h1>Thank You, <span class="gold-text">Royal Guest</span>!</h1>
            <p style="color: var(--on-surface-variant); margin-bottom: 8px;">
                Your order has been placed with the royal kitchen.
            </p>
            <div th:if="${itemCount}" style="margin-top: 16px;">
                <span class="badge badge-gold" th:text="'Processing ' + ${itemCount} + ' item(s)'">Processing 1 item(s)</span>
            </div>
            <div class="amount-display" th:text="'₹' + ${amount}">₹500</div>
            <p style="color: var(--on-surface-variant); font-size: 0.85rem;">Total Amount</p>
            <p style="color: var(--on-surface-variant); font-size: 0.8rem; margin-top: 16px;">
                <i class="fa-solid fa-clock" style="color: var(--gold);"></i> Estimated delivery: 30-40 minutes
            </p>
            <div class="success-actions">
                <a href="/dashboard" class="btn btn-primary"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
                <a href="/products" class="btn btn-outline"><i class="fa-solid fa-utensils"></i> Order More</a>
            </div>
        </div>
    </div>
    <script>
        // Confetti animation
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('confettiContainer');
            const colors = ['#C9A84C', '#E8D48B', '#800020', '#D4AF37', '#FFF9E6', '#0A0B1A'];
            for (let i = 0; i < 80; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + '%';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.width = (Math.random() * 8 + 4) + 'px';
                piece.style.height = (Math.random() * 8 + 4) + 'px';
                piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
                piece.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(piece);
            }
        });
    </script>
</body>
</html>

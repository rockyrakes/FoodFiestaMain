<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Food Fiesta Royal</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        .menu-page { background: var(--surface-variant); min-height: 100vh; }
        .menu-container { max-width: 1300px; margin: 0 auto; padding: 140px 5% 100px; }
        .menu-header { text-align: center; margin-bottom: 60px; }
        .menu-header h1 { font-family: var(--font-display); font-size: 3.5rem; }
        .filters { display: flex; justify-content: center; gap: 12px; margin-bottom: 50px; flex-wrap: wrap; }
        .filter-btn {
            padding: 12px 28px; border-radius: var(--radius-full);
            border: 1.5px solid var(--outline); background: white;
            cursor: pointer; font-weight: 600; font-size: 0.85rem;
            transition: var(--transition); font-family: var(--font-body);
            color: var(--on-surface-variant);
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--gold-gradient); color: var(--on-primary);
            border-color: var(--gold); box-shadow: 0 4px 15px rgba(201,168,76,0.3);
            transform: translateY(-2px);
        }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 40px; }
        .food-card {
            background: white; border-radius: var(--radius-lg); overflow: hidden;
            transition: var(--transition-smooth);
            border: 1px solid var(--outline); position: relative;
        }
        .food-card:hover {
            transform: translateY(-12px); box-shadow: var(--shadow-xl);
            border-color: var(--gold);
        }
        .food-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0;
            height: 3px; background: var(--gold-gradient);
            transform: scaleX(0); transition: transform 0.6s ease;
            z-index: 2;
        }
        .food-card:hover::before { transform: scaleX(1); }
        .image-wrapper { width: 100%; height: 280px; overflow: hidden; position: relative; }
        .image-wrapper::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(transparent 60%, rgba(0,0,0,0.1));
        }
        .image-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
        .food-card:hover .image-wrapper img { transform: scale(1.12); }
        .card-content { padding: 28px; position: relative; background: white; }
        .price-tag {
            background: var(--gold-gradient); color: var(--on-primary);
            padding: 8px 18px; border-radius: var(--radius-full);
            font-weight: 800; position: absolute; top: -22px; right: 24px;
            box-shadow: 0 6px 20px rgba(201,168,76,0.3);
            font-size: 0.95rem;
        }
        .rating { color: #f59e0b; font-size: 0.85rem; margin-bottom: 8px; display: block; }
        .buy-btn {
            display: block; width: 100%; text-align: center; margin-top: 20px;
            padding: 14px; border-radius: var(--radius-md);
            background: var(--surface-container-low); color: var(--on-surface);
            text-decoration: none; font-weight: 700; font-size: 0.9rem;
            transition: var(--transition); border: none; cursor: pointer;
            font-family: var(--font-body);
        }
        .buy-btn:hover { background: var(--gold-gradient); color: var(--on-primary); transform: translateY(-2px); box-shadow: 0 4px 15px rgba(201,168,76,0.3); }
        .category-badge {
            position: absolute; top: 16px; left: 16px;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
            padding: 6px 14px; border-radius: var(--radius-full);
            font-size: 0.7rem; font-weight: 700; color: var(--gold-dark);
            z-index: 1; border: 1px solid rgba(201,168,76,0.3);
        }
        @media (max-width: 768px) {
            .menu-container { padding-top: 120px; }
            .menu-grid { gap: 24px; }
        }
    </style>
</head>

<body class="menu-page">
    <nav th:replace="~{Navigation::navbar()}"></nav>
    <div class="menu-container">
        <div class="menu-header">
            <div class="reveal"><span class="section-tag">Curated Selection</span></div>
            <h1 class="reveal" style="transition-delay: 0.1s;">The <span class="gold-text">Royal</span> Menu</h1>
            <div class="gold-divider reveal" style="transition-delay: 0.15s;"></div>
            <p class="reveal" style="transition-delay: 0.2s; color: var(--on-surface-variant);">Discover a symphony of flavors crafted by master chefs.</p>
        </div>
        <div class="filters reveal" style="transition-delay: 0.25s;">
            <button class="filter-btn active" data-category="all">All Dishes</button>
            <button class="filter-btn" data-category="Biryani">Biryani</button>
            <button class="filter-btn" data-category="North Indian">North Indian</button>
            <button class="filter-btn" data-category="Chinese">Chinese</button>
            <button class="filter-btn" data-category="Desserts">Desserts</button>
        </div>
        <div class="menu-grid" id="menuGrid">
            <!-- Products will be dynamically rendered here -->
        </div>
    </div>

    <!-- Order Confirmation Modal -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-icon"><i class="fa-solid fa-crown"></i></div>
                <h2>Confirm Your <span class="gold-text">Royal Order</span></h2>
                <button class="modal-close" onclick="closeOrderModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
            <form id="orderForm" action="/product/order" method="POST">
                    <div class="order-summary-card">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <span style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--gold); font-weight: 700;">Selected Dish</span>
                                <h3 id="modalDishName" style="margin-top: 4px;">Hyderabadi Biryani</h3>
                            </div>
                            <div class="modal-price" id="modalDishPrice">₹410</div>
                        </div>
                    </div>

                    <input type="hidden" name="oName" id="modalProductName" value="">
                    <input type="hidden" name="oPrice" id="modalProductPrice" value="">

                    <div style="margin-top: 24px;">
                        <h4 style="margin-bottom: 16px;"><i class="fa-solid fa-location-dot" style="color: var(--gold);"></i> Delivery Details</h4>
                        <div style="display: grid; gap: 16px;">
                            <div>
                                <label style="font-size: 0.85rem; font-weight: 700;">Full Name</label>
                                <input type="text" class="input-field" id="deliveryName" placeholder="Your name..." required>
                            </div>
                            <div>
                                <label style="font-size: 0.85rem; font-weight: 700;">Phone Number</label>
                                <input type="tel" class="input-field" id="deliveryPhone" placeholder="+91 9876543210" required>
                            </div>
                            <div>
                                <label style="font-size: 0.85rem; font-weight: 700;">Delivery Address</label>
                                <textarea class="input-field" id="deliveryAddress" rows="2" placeholder="House/Flat, Street, Landmark..." style="resize: vertical;" required></textarea>
                            </div>
                            <div>
                                <label style="font-size: 0.85rem; font-weight: 700;">Quantity</label>
                                <div style="display: flex; gap: 12px; align-items: center; margin-top: 8px;">
                                    <button type="button" class="qty-btn" onclick="changeQty(-1)"><i class="fa-solid fa-minus"></i></button>
                                    <span id="orderQtyDisplay" style="font-size: 1.5rem; font-weight: 800; min-width: 40px; text-align: center;">1</span>
                                    <button type="button" class="qty-btn" onclick="changeQty(1)"><i class="fa-solid fa-plus"></i></button>
                                    <input type="hidden" name="oQuantity" id="orderQtyInput" value="1">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="modal-total">
                        <span>Total Amount</span>
                        <span id="modalTotalAmount" style="font-size: 1.5rem; font-weight: 800; color: var(--gold-dark);">₹410</span>
                    </div>

                    <button type="submit" class="btn btn-gold" style="width: 100%; height: 56px; font-size: 1rem; margin-top: 8px;">
                        <i class="fa-solid fa-check-circle"></i> Confirm & Place Order
                    </button>
                </form>
            </div>
        </div>
    </div>

    <style>
        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 11, 26, 0.6);
            backdrop-filter: blur(8px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.open { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .modal-container {
            background: white;
            border-radius: var(--radius-xl);
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
            animation: slideUpModal 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            border: 1px solid var(--outline);
            position: relative;
        }
        .modal-container::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: calc(var(--radius-xl) + 2px);
            background: var(--gold-gradient);
            z-index: -1;
            opacity: 0.3;
        }
        @keyframes slideUpModal {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .modal-header {
            padding: 32px 32px 16px;
            text-align: center;
            position: relative;
            border-bottom: 1px solid var(--outline);
        }
        .modal-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--primary-container), #FFF9E6);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            border: 2px solid var(--gold);
        }
        .modal-icon i { font-size: 1.5rem; color: var(--gold); }
        .modal-close {
            position: absolute;
            top: 20px; right: 20px;
            background: var(--surface-variant);
            border: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
            color: var(--on-surface-variant);
            transition: var(--transition);
        }
        .modal-close:hover { background: #fee2e2; color: #dc2626; transform: rotate(90deg); }
        
        .modal-body { padding: 24px 32px 32px; }
        
        .order-summary-card {
            background: var(--surface-variant);
            padding: 20px;
            border-radius: var(--radius-md);
            border: 1px solid var(--outline);
        }
        .modal-price {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--gold-dark);
        }
        
        .qty-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 1.5px solid var(--outline);
            background: white;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem;
            color: var(--on-surface);
            transition: var(--transition);
        }
        .qty-btn:hover {
            border-color: var(--gold);
            background: var(--primary-container);
            color: var(--gold-dark);
        }
        
        .modal-total {
            margin-top: 24px;
            padding: 20px;
            background: var(--cream);
            border-radius: var(--radius-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--outline);
        }
        
        @media (max-width: 480px) {
            .modal-header { padding: 24px 20px 12px; }
            .modal-body { padding: 16px 20px 24px; }
        }
    </style>

    <script th:inline="javascript">
        const isLoggedIn = /*[[${session.loggedInUser != null}]]*/ false;
        let products = /*[[${products}]]*/ [];

        let selectedPrice = 0;
        let selectedProductName = '';

        function renderProducts(productsArray) {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = productsArray.map((p, i) => {
                const categories = ['Biryani', 'North Indian', 'Chinese', 'Desserts'];
                const cat = categories[i % categories.length];
                const images = [
                    '/Images/biryani/Biryani_of_Hyderabadi.jpg',
                    '/Images/paneer/paneer-butter-masala.jpg',
                    '/Images/chicken/butter-chicken.jpg',
                    '/Images/north-india-food/Honey-Chilli-Potato.jpg',
                    '/Images/north-india-food/chola-bhatura.jpg',
                    '/Images/north-india-food/Gulab Jamun.jpg',
                    '/Images/biryani/Lucknowi-biryani.jpg',
                    '/Images/chinese/chowmein.jpg',
                    '/Images/paneer/Kadai-Paneer.jpg',
                    '/Images/north-india-food/Khir.jpg',
                    '/Images/chinese/momo.webp',
                    '/Images/north-india-food/Laccha-Paratha.jpg'
                ];
                const img = images[i % images.length];
                const stars = (4.5 + (i * 0.1) % 0.6).toFixed(1);
                const ratings = [120, 95, 200, 80, 150, 300, 80, 110, 140, 170, 250, 40];
                
                return `<div class="food-card reveal" style="transition-delay: ${0.1 + i * 0.05}s" data-category="${cat}">
                    <div class="image-wrapper">
                        <span class="category-badge"><i class="fa-solid fa-utensils"></i> ${cat}</span>
                        <img src="${img}" alt="${p.pname}" onerror="this.src='https://via.placeholder.com/400x280/E8D48B/1A1505?text=Food+Fiesta'">
                    </div>
                    <div class="card-content">
                        <span class="price-tag">₹${p.pprice}</span>
                        <span class="rating"><i class="fa-solid fa-star"></i> ${stars} (${ratings[i % ratings.length]}+)</span>
                        <h3>${p.pname}</h3>
                        <p style="font-size: 0.85rem; color: var(--on-surface-variant); margin-top: 5px;">${p.pdescription || 'Signature dish crafted with premium ingredients and royal spices.'}</p>
                        <button class="buy-btn buy-action" data-pname="${p.pname}" data-price="${p.pprice}">Order Now <i class="fa-solid fa-bag-shopping"></i></button>
                    </div>
                </div>`;
            }).join('');
            
            document.querySelectorAll('.buy-action').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (!isLoggedIn) {
                        alert('Welcome to Food Fiesta! Please sign in to place your royal order.');
                        window.location.href = "/login";
                        return;
                    }
                    const pname = this.getAttribute('data-pname');
                    const price = parseFloat(this.getAttribute('data-price'));
                    openOrderModal(pname, price);
                });
            });
        }

        // Order Modal Functions
        function openOrderModal(name, price) {
            selectedProductName = name;
            selectedPrice = price;
            document.getElementById('modalDishName').textContent = name;
            document.getElementById('modalDishPrice').textContent = '₹' + price;
            document.getElementById('modalProductName').value = name;
            document.getElementById('modalProductPrice').value = price;
            document.getElementById('orderQtyDisplay').textContent = '1';
            document.getElementById('orderQtyInput').value = '1';
            document.getElementById('modalTotalAmount').textContent = '₹' + price;
            document.getElementById('orderModal').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeOrderModal() {
            document.getElementById('orderModal').classList.remove('open');
            document.body.style.overflow = '';
        }

        let currentQty = 1;
        function changeQty(delta) {
            currentQty = Math.max(1, currentQty + delta);
            document.getElementById('orderQtyDisplay').textContent = currentQty;
            document.getElementById('orderQtyInput').value = currentQty;
            document.getElementById('modalTotalAmount').textContent = '₹' + (selectedPrice * currentQty);
        }

        // Close modal on overlay click
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('modal-overlay')) {
                closeOrderModal();
            }
        });

        // Close modal on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeOrderModal();
        });

        document.addEventListener('DOMContentLoaded', function() {
            if (products && products.length > 0) {
                renderProducts(products);
            } else {
                const fallback = [
                    {pname: 'Hyderabadi Biryani', pprice: 410, pdescription: 'Authentic slow-cooked basmati rice with tender spice-marinated chicken.'},
                    {pname: 'Paneer Butter Masala', pprice: 290, pdescription: 'Rich and creamy tomato base with fresh cubes of cottage cheese.'},
                    {pname: 'Royal Butter Chicken', pprice: 380, pdescription: 'Our signature dish. Silky smooth gravy with tandoori chicken chunks.'},
                    {pname: 'Honey Chilli Potato', pprice: 150, pdescription: 'Crispy potato fries glazed with honey and fiery Schezwan sauce.'},
                    {pname: 'Classic Chola Bhatura', pprice: 180, pdescription: 'Fluffy puffed bread served with spicy chickpea curry and pickles.'},
                    {pname: 'Gulab Jamun (2pcs)', pprice: 50, pdescription: 'Warm, syrup-soaked berry-sized balls made with milk solids.'},
                    {pname: 'Saffron Lucknowi Biryani', pprice: 450, pdescription: 'Royal Awadhi style biryani with aromatic Lucknowi spices.'},
                    {pname: 'Dragon Hakka Noodles', pprice: 180, pdescription: 'Wok-fired noodles tossed with crisp garden veggies and sesame oil.'},
                    {pname: 'Spicy Kadai Paneer', pprice: 310, pdescription: 'Fresh cottage cheese chunks cooked with bell peppers and ground spices.'},
                    {pname: 'Traditional Rice Khir', pprice: 120, pdescription: 'Creamy Indian rice pudding slow-cooked with saffron and cardamom.'},
                    {pname: 'Steamed Veggie Momos', pprice: 140, pdescription: 'Delicate handcrafted dumplings served with fiery red chutney.'},
                    {pname: 'Laccha Paratha', pprice: 60, pdescription: 'Multilayered crispy whole wheat bread cooked in pure ghee.'}
                ];
                renderProducts(fallback);
            }

            // Filter logic
            const filterBtns = document.querySelectorAll('.filter-btn');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const category = this.getAttribute('data-category');
                    document.querySelectorAll('.food-card').forEach(card => {
                        if (category === 'all' || card.getAttribute('data-category') === category) {
                            card.style.display = 'block';
                        } else {
                            card.style.display = 'none';
                        }
                    });
                });
            });

            // Scroll Reveal
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('visible');
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        });
    </script>
</body>

</html>

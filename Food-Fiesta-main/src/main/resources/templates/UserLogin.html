<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>User Login | Food Fiesta Royal</title>
	<link rel="stylesheet" th:href="@{/css/main.css}" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
	<nav th:replace="~{Navigation::navbar()}"></nav>
	<div class="auth-wrapper">
		<div class="auth-card animate-up">
			<div style="margin-bottom: 32px; text-align: center;">
				<div style="width: 64px; height: 64px; background: var(--gold-gradient); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
					<i class="fa-solid fa-user-crown" style="color: var(--on-primary); font-size: 1.5rem;"></i>
				</div>
				<h2 style="font-size: 2rem; margin-bottom: 8px;">Welcome <span class="gold-text">Back</span></h2>
				<p style="font-size: 0.875rem; color: var(--on-surface-variant);">Sign in to your royal account</p>
			</div>
			<form th:action="@{/userLogin}" method="post">
				<div style="margin-bottom: 20px;">
					<label style="font-size: 0.875rem; font-weight: 700;">Email Address</label>
					<input type="email" name="userEmail" placeholder="you@example.com" class="input-field" required>
				</div>
				<div style="margin-bottom: 24px;">
					<label style="font-size: 0.875rem; font-weight: 700;">Password</label>
					<input type="password" name="userPassword" placeholder="••••••••" class="input-field" required>
				</div>
				<p th:if="${error2}" th:text="${error2}" style="color: var(--burgundy); font-size: 0.875rem; margin-bottom: 16px; text-align: center;"></p>
				<button type="submit" class="btn btn-gold" style="width: 100%; padding: 16px;">Access Royal Menu <i class="fa-solid fa-arrow-right"></i></button>
			</form>
			<div style="margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--outline); text-align: center;">
				<p style="font-size: 0.875rem; color: var(--on-surface-variant);">
					New here? <a th:href="@{/register}" style="color: var(--gold); font-weight: 800; text-decoration: none;">Join the Royal Feast</a>
				</p>
				<p style="font-size: 0.875rem; color: var(--on-surface-variant); margin-top: 12px;">
					Admin? <a th:href="@{/login}" style="color: var(--on-surface); font-weight: 600; text-decoration: none;">Access Dashboard</a>
				</p>
			</div>
		</div>
	</div>
	<footer style="padding: 40px; text-align: center; color: var(--on-surface-variant); font-size: 0.85rem; border-top: 1px solid var(--outline);">
		&copy; 2026 Food Fiesta Royal. Secured for your privacy.
	</footer>
</body>
</html>

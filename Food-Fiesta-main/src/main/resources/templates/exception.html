<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Error | Food Fiesta Royal</title>
	<link rel="stylesheet" th:href="@{/css/main.css}" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	<style>
		.error-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 5%; background: var(--surface-variant); }
		.error-card { max-width: 500px; width: 100%; background: white; padding: 60px 40px; border-radius: var(--radius-xl); box-shadow: var(--shadow-xl); border: 1px solid var(--outline); text-align: center; }
		.error-icon { width: 80px; height: 80px; background: linear-gradient(135deg, #DC2626, #EF4444); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
		.error-icon i { font-size: 2.5rem; color: white; }
	</style>
</head>
<body>
	<div class="error-container">
		<div class="error-card animate-up">
			<div class="error-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
			<h2 style="font-size: 2rem; margin-bottom: 8px;">Oops! <span style="color: #DC2626;">Error</span></h2>
			<div class="gold-divider"></div>
			<p style="color: var(--on-surface-variant); margin-bottom: 16px;">Something went wrong with your royal experience.</p>
			<small style="color: var(--burgundy); display: block; margin-bottom: 32px;">Possible: Invalid data or duplicate email.</small>
			<div style="display: flex; gap: 12px; justify-content: center;">
				<a href="/admin/services" class="btn btn-outline">Go Back</a>
				<a href="http://www.google.com" target="_blank" class="btn btn-gold">Get Help <i class="fa-solid fa-external-link-alt"></i></a>
			</div>
		</div>
	</div>
</body>
</html>

server.port=8081

# PostgreSQL Connection (Docker / Production) - uses env vars SPRING_DATASOURCE_URL etc.
# H2 Fallback (Local Development)
spring.datasource.url=jdbc:h2:file:./data/foodfiesta
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Fix for PostgreSQL timezone issue (Asia/Calcutta is deprecated)
spring.datasource.hikari.data-source-properties.connectionTimeZone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect.storage_engine=innodb

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf Caching (Off for Development)
spring.thymeleaf.cache=false

# File upload config
spring.servlet.multipart.enabled=true

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=YOUR_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=profile,email


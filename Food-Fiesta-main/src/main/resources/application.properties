# Server Port - Use PORT env variable (Render.com provides this) or default 8080
server.port=${PORT:8080}

# ============================================
# DATABASE CONFIGURATION
# ============================================
# The app uses H2 by default (file-based for persistence)
# For Render.com deployment, we use H2 in-memory so data resets on restart
# To use PostgreSQL on Render, add a PostgreSQL DB and set these env vars:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://...
#   SPRING_DATASOURCE_USERNAME=...
#   SPRING_DATASOURCE_PASSWORD=...
#   SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
#   SPRING_JPA_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/foodfiesta}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Settings
spring.jpa.database-platform=${SPRING_JPA_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Timezone settings
spring.datasource.hikari.data-source-properties.connectionTimeZone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect.storage_engine=innodb

# H2 Console (accessible at /h2-console in local dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Thymeleaf
spring.thymeleaf.cache=false

# File upload
spring.servlet.multipart.enabled=true

# Google OAuth2 Configuration (optional - set env vars in Render dashboard)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

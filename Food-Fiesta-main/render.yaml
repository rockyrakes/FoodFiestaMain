# Render.com Deployment Configuration for Food Fiesta Royal
# This file tells Render.com how to build and run the application

services:
  # Web service for the Java Spring Boot application
  - type: web
    name: food-fiesta-royal
    env: java
    plan: free  # Free tier (limited, but enough for demo)
    
    # Build command
    buildCommand: ./mvnw clean package -DskipTests
    
    # Start command
    startCommand: java -jar target/*.jar
    
    # Health check path
    healthCheckPath: /home
    
    # Environment variables
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:file:./data/foodfiesta;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      - key: SPRING_DATASOURCE_DRIVER
        value: org.h2.Driver
      - key: SPRING_DATASOURCE_USERNAME
        value: sa
      - key: SPRING_DATASOURCE_PASSWORD
        value: ""
      - key: SPRING_JPA_PLATFORM
        value: org.hibernate.dialect.H2Dialect
      - key: JAVA_OPTS
        value: "-Xmx256m -Xms128m"
      - key: SPRING_THYMELEAF_CACHE
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false  # Set this manually in Render dashboard if using Google login
      - key: GOOGLE_CLIENT_SECRET
        sync: false
